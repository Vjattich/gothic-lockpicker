<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>Gothic Lockpicker</title>
    <link href="icon.png" rel="icon">
    <style>

        :root {
            --block-scale: 1;

            --bg: orange;
            --bg-active: #e59400;
            --bg-hover: #ffa600;

            --panel: #1a1a1a;
            --surface: #222;
            --surface-2: #333;
            --surface-3: #3a3a3a;
            --border: #444;
            --dark: #111;

            --text: #ccc;
            --muted: #888;

            --metal: #777;
            --plate-border: #999;

            --green: #66d437;
            --green-bright: #7aef48;
            --blue: #37a1d4;
            --red: #d43737;
            --yellow: #d4d137;
        }

        /* 2. Base ---------------------------------------------------------------- */

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body,
        #lock,
        .plate,
        .hole {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        body.is-dragging .plate {
            will-change: transform;
        }

        /* 3. Controls panel ------------------------------------------------------ */

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel);
            padding: 20px;
            border: 1px solid var(--surface-2);
            border-radius: 8px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            width: calc(100vw - 40px);
            max-width: 400px;
            box-sizing: border-box;
            font-size: 17px;
        }

        .controls-item {
            margin-bottom: 15px;
        }

        /* Rows that stretch open when a solution is available */
        .dynamic-control {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-top: 0;
            transition: max-height 0.4s ease-out, opacity 0.3s ease-out, margin-top 0.4s ease-out;
        }

        .dynamic-control.show-stretch {
            max-height: 200px;
            opacity: 1;
            margin-top: 15px;
        }

        .controls label:not(.toggle-label) {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            font-size: 17px;
            gap: 8px;
            color: var(--text);
        }

        .toggle-label {
            display: flex;
            flex-direction: row;
            align-items: center;
            font-size: 13px;
            gap: 8px;
            color: var(--text);
            cursor: pointer;
        }

        .toggle-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            margin: 0;
        }

        .controls input[type="range"],
        .controls input[type="number"] {
            cursor: pointer;
            background: var(--surface);
            color: #fff;
            border: 1px solid var(--border);
            padding: 5px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        #countInput {
            font-size: 17px;
        }

        .controls button {
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: white;
            font-weight: bold;
            transition: background 0.2s;
            font-size: 17px;
        }

        .controls button:disabled {
            background: var(--surface);
            color: #666;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Block-count stepper */
        .number-control {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            flex-wrap: nowrap;
            min-width: 0;
        }

        .number-control button {
            width: 80%;
        }

        .number-control input[type="number"] {
            -moz-appearance: textfield;
            text-align: center;
            width: 100%;
        }

        .number-control input[type="number"]::-webkit-inner-spin-button,
        .number-control input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .num-btn {
            background: var(--surface-2);
            color: #fff;
            border: 1px solid var(--border) !important;
            border-radius: 4px;
            width: 32px;
            height: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            padding: 0 !important;
        }

        .num-btn:active,
        .controls button:active {
            background: var(--surface);
        }

        /* Reset / Solve / Share row */
        .action-row {
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: 100%;
            align-items: stretch;
        }

        #resetBtn,
        #shareBtn {
            flex: 0 0 44px;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--surface-2);
        }

        #solveBtn {
            flex: 1;
            height: 44px;
            margin: 0;
            font-weight: bold;
            background: var(--bg);
            border-color: #357abd;
            color: var(--dark);
        }

        #solveBtn:active:not(:disabled) {
            background: var(--bg-active);
        }

        /* 4. Search panel (matching saved locks) --------------------------------- */

        .search-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            color: var(--text);
            font-size: 17px;
        }

        .search-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .search-ico {
            flex: 0 0 auto;
            color: var(--green);
            display: none;
        }

        .search-value {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        #matchCountText {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-row.has-matches #matchCountText {
            color: var(--green-bright);
            font-weight: bold;
        }

        .search-chevron {
            flex: 0 0 auto;
            color: var(--muted);
            transition: transform 0.3s ease;
            transform: rotate(-90deg);
        }

        .search-panel {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 0;
            background: var(--panel);
            border-radius: 8px;
            padding: 0 16px;
            box-sizing: border-box;
            z-index: 20;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            visibility: hidden;
            pointer-events: none;
            /* Same stretch animation as .solution-list (height 0.3s ease-out, no fade) */
            transition: height 0.3s ease-out, padding 0.3s ease-out, visibility 0s linear 0.3s;
        }

        .search-panel.is-open {
            visibility: visible;
            pointer-events: auto;
            padding: 16px;
            transition: height 0.3s ease-out, padding 0.3s ease-out, visibility 0s;
        }

        .search-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex: 0 0 auto;
        }

        .search-panel-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--text);
        }

        .search-close {
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
        }

        .search-close:active {
            background: var(--surface);
        }

        .search-close .ico-roll {
            display: none;
        }

        .search-body {
            flex: 1 1 auto;
            overflow-y: auto;
            min-height: 0;
        }

        .search-empty {
            padding: 14px 10px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .search-list:empty {
            display: none;
        }

        .search-item {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 10px;
            cursor: pointer;
        }

        /* 5. Playback / solution list -------------------------------------------- */

        .play-status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .play-status-row.show-stretch {
            min-height: 30px;
        }

        .playback-controls {
            display: flex;
        }

        .play-status-row button,
        .step-controls-row button {
            padding: 6px 15px;
            font-size: 14px;
            background: var(--green);
            color: var(--dark);
            flex-shrink: 0;
        }

        #restartSeqBtn {
            display: none;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            border-right: none;
            padding-left: 10px;
            padding-right: 10px;
        }

        #playBtn {
            display: none;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        .status-message {
            font-size: 13px;
            font-weight: bold;
        }

        .status-error {
            color: #ff4444;
        }

        .status-success {
            color: var(--green);
        }

        .status-info {
            color: var(--blue);
        }

        .step-controls-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .step-controls-row.is-expanded-parent {
            max-height: 1000px !important;
            transition: max-height 0.3s ease-out;
        }

        .solution-list {
            flex-grow: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            padding: 10px;
            height: 120px;
            max-height: 120px;
            overflow-y: auto !important;
            font-size: 13px;
            font-family: monospace;
            transition: height 0.3s ease-out, max-height 0.3s ease-out;
        }

        .solution-list div {
            padding: 4px 5px;
            border-bottom: 1px solid var(--surface-2);
            transition: background 0.2s, color 0.2s;
            border-radius: 3px;
            box-sizing: border-box;
        }

        .solution-list div:last-child {
            border-bottom: none;
        }

        .solution-list div.active-step {
            background: rgba(102, 212, 55, 0.2);
            color: var(--green-bright);
            font-weight: bold;
        }

        .solution-list div:hover:not(.active-step) {
            background: rgba(255, 255, 255, 0.1);
        }

        .expand-list-item {
            display: block;
            width: 100%;
            background: #2a2a2a;
            color: var(--muted);
            border: 1px solid var(--border);
            border-top: 1px solid var(--dark);
            padding: 6px 0;
            margin: 0;
            font-size: 12px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border-radius: 0 0 4px 4px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .expand-list-item:active {
            background: var(--surface-3);
            color: #fff;
        }

        /* Long-press fill animation on step buttons */
        #nextBtn,
        #prevBtn {
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        #nextBtn::after,
        #prevBtn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0;
            background: rgba(255, 255, 255, 0.4);
            z-index: -1;
            transition: width 0s linear;
        }

        #nextBtn.is-pressing::after,
        #prevBtn.is-pressing::after {
            width: 100%;
            transition: width 0.45s linear;
        }

        /* 6. 3D lock scene --------------------------------------------------------
           Careful with the translateZ offsets and the @supports blocks below:
           they compensate for Chrome/Firefox 3D-rendering seams.
         */

        .scene {
            position: relative;
            left: 150px;
            perspective: 1200px;
        }

        .lock-mechanism {
            position: relative;
            width: 340px;
            height: 200px;
            transform-style: preserve-3d;
            transform: scale(var(--block-scale)) rotateX(-30deg) rotateY(-40deg) rotateZ(0deg);
            transition: transform 0.2s ease-out;
        }

        .plate {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out;
            cursor: grab;
            touch-action: none;
        }

        .plate:active {
            cursor: grabbing;
        }

        .front-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2a2a2a, var(--dark));
            border: 5px solid var(--plate-border);
            border-radius: 30px;
            box-sizing: border-box;
            transform: translateZ(12px);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: 1px solid transparent; /* Chrome 3D seam fix */
        }

        .top-face,
        .bottom-face {
            position: absolute;
            left: 30px;
            width: calc(100% - 60px);
            height: 24px;
            background: var(--metal);
            box-sizing: border-box;
        }

        .top-face {
            top: 0;
            transform-origin: top;
            transform: translateZ(12px) rotateX(-90deg);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            transform-style: preserve-3d;
        }

        .bottom-face {
            bottom: 0;
            transform-origin: bottom;
            transform: translateZ(11px) rotateX(90deg);
        }

        .right-face,
        .left-face {
            position: absolute;
            top: 29px;
            width: 22px;
            height: calc(100% - 60px);
            background: var(--metal);
            box-sizing: border-box;
        }

        .right-face {
            right: 0;
            border-right: 1px solid var(--metal);
            transform-origin: right;
            transform: translateZ(-10.6px) rotateY(90deg);
        }

        .left-face {
            left: 0;
            border-left: 1px solid var(--metal);
            transform-origin: left;
            transform: translateZ(-13px) rotateY(-90deg);
        }

        /* Chrome / WebKit specific offsets */
        @supports (-webkit-appearance: none) {
            .right-face {
                transform: translateZ(-10px) rotateY(90deg);
            }

            .pin-side {
                left: 50%;
                width: 3px;
            }

            .pin-cap {
                left: 1px !important;
                transform: translateZ(0.4px) !important;
            }
        }

        /* Firefox specific offsets */
        @supports (-moz-appearance: none) {
            .right-face {
                outline: 1.4px solid var(--metal) !important;
                transform: translateZ(-10px) rotateY(90deg);
            }

            .pin-side {
                left: calc(50% - 1px);
                width: 3px;
            }

            .pin-cap {
                left: 0.3px !important;
                transform: translateZ(-0.2px) !important;
            }
        }

        .corner-tube {
            position: absolute;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .tube-tr { top: 30px;    right: 30px; }
        .tube-br { bottom: 30px; right: 30px; }
        .tube-bl { bottom: 30px; left: 30px; }
        .tube-tl { top: 30px;    left: 30px; }

        .tube-panel {
            position: absolute;
            left: -5px;
            top: -12px;
            width: 8px;
            height: 23px;
            background: var(--metal);
            border-left: 1px solid var(--metal);
            transform-origin: center center;
        }

        .top-face,
        .bottom-face,
        .right-face,
        .left-face,
        .tube-panel {
            outline: 1px solid var(--metal);
        }

        .hole {
            width: 12px;
            height: 12px;
            background-color: #000;
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.3);
            position: relative;
            transform-style: preserve-3d;
            z-index: 1;
        }

        .hole.glow-white {
            background-color: #fff;
            box-shadow: 0 0 10px 3px rgba(255, 255, 255, 0.8), inset 2px 2px 4px rgb(255 255 255 / 0.3);
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .pin-hole {
            z-index: 5;
        }

        .pin-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            z-index: 10;
            pointer-events: none;
        }

        .pin {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateZ(0px);
            z-index: 20;
            opacity: 0;
        }

        .pin.pin-visible {
            opacity: 1;
        }

        .pin-cap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #e6b981, #b87333);
            border-radius: 50%;
            transform: translateZ(0);
        }

        .pin-body {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 19px;
            opacity: 0;
            transform-style: preserve-3d;
            transform: translateZ(-0.4px);
        }

        .pin.pin-body-visible .pin-body {
            opacity: 1;
        }

        .pin-side {
            position: absolute;
            top: 30%;
            height: 18px;
            background: linear-gradient(180deg, #b87333, #5a3212);
            transform-origin: center top;
            backface-visibility: hidden;
        }

        /* Force WebKit to strictly preserve 3D context on all depth elements */
        .lock-mechanism,
        .plate,
        .top-face,
        .corner-tube,
        .hole,
        .pin-wrapper,
        .pin,
        .pin-body {
            -webkit-transform-style: preserve-3d;
        }

        /* 7. Plate highlight states ----------------------------------------------
           selected = green (linker master), linked = blue (moves together),
           rinked = red (moves opposite), touched = white hover outline.
        */

        .plate.selected .front-face {
            border-color: var(--green);
            box-shadow: inset 0 0 20px rgba(102, 212, 55, 0.3), 0 0 15px rgba(102, 212, 55, 0.5);
        }

        .plate.linked .front-face {
            border-color: var(--blue);
            box-shadow: inset 0 0 20px rgba(55, 161, 212, 0.3), 0 0 15px rgba(55, 161, 212, 0.5);
        }

        .plate.rinked .front-face {
            border-color: var(--red);
            box-shadow: inset 0 0 20px rgba(212, 55, 55, 0.3), 0 0 15px rgba(212, 55, 55, 0.5);
        }

        .plate.touched:not(.selected, .linked, .rinked, .selected-glow) .front-face {
            border-color: rgba(255, 255, 255, 0.9);
            transition: border-color 0.05s, box-shadow 0.05s;
        }

        .plate.touched.selected-glow .front-face {
            border-color: var(--yellow);
            box-shadow: inset 0 0 20px rgba(212, 209, 55, 0.3), 0 0 15px rgba(212, 204, 55, 0.5);
            transition: border-color 0.05s, box-shadow 0.05s;
        }

        body.is-zooming .plate .front-face {
            border-color: var(--plate-border) !important;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9) !important;
            transition: none !important;
        }

        @media (hover: hover) {
            .num-btn:hover,
            .controls button:hover,
            #resetBtn:hover,
            #shareBtn:hover {
                background: var(--border);
            }

            #solveBtn:hover:not(:disabled) {
                background: var(--bg-hover);
            }

            .play-status-row button:hover:not(:disabled),
            .step-controls-row button:hover:not(:disabled) {
                background: var(--green-bright);
            }

            .plate.glow:not(.selected, .linked, .rinked, .selected-glow):hover .front-face {
                border-color: rgba(255, 255, 255, 0.9);
                transition: border-color 0.1s, box-shadow 0.1s;
            }

            .plate.selected-glow:hover .front-face {
                border-color: var(--yellow);
                box-shadow: inset 0 0 20px rgba(212, 209, 55, 0.3), 0 0 15px rgba(212, 204, 55, 0.5);
            }
        }

        @media (hover: none) {
            .controls button:disabled {
                pointer-events: none;
            }
        }

        /* 8. Inspector row (mobile plate picker) ---------------------------------- */

        .inspector-row {
            display: none;
            flex-direction: row;
            justify-content: space-between;
            flex: 1 1 auto;
            min-width: 0;
        }

        .inspect-btn {
            flex: 1 1 0;
            min-width: 0;
            height: 35px;
            background: var(--surface-2);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            margin: 0 1px;
            padding: 0;
            touch-action: none;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
        }

        .disabled-btn {
            opacity: 0.25;
            background: var(--dark) !important;
            color: var(--metal) !important;
            border-color: var(--surface) !important;
            pointer-events: none;
        }

        /* 9. Tutorial -------------------------------------------------------------- */

        .tutorial-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: 999;
            display: none;
        }

        .tutorial-bubble {
            position: absolute;
            top: 3%;
            left: 65%;
            width: 40%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            max-width: 80%;
            text-align: center;
            font-size: 20px;
            line-height: 1.4;
            z-index: 1000;
            display: none;
            pointer-events: none;
            bottom: auto !important;
        }

        .tutorial-arrow {
            position: absolute;
            color: white;
            font-size: 48px;
            font-weight: bold;
            display: none;
            z-index: 1000;
            pointer-events: none;
            animation: arrow-bounce 1s infinite ease-in-out;
        }

        @keyframes arrow-bounce {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-15px); }
        }

        /* 10. Footer ---------------------------------------------------------------- */

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            z-index: 1;
            transition: opacity 0.3s ease-out;
        }

        .box40,
        .question-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            width: 40px;
            flex-shrink: 0;
        }

        .box40 svg,
        .question-mark svg {
            display: block;
            width: 100%;
            height: 100%;
            margin-bottom: 2px;
        }

        .question-mark {
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .question-mark:active {
            transform: scale(0.9);
        }

        .guide-nav {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 10px;
            display: none;
            transition: transform 0.1s ease;
            user-select: none;
            align-items: center;
            justify-content: center;
            height: 40px;
            flex-shrink: 0;
        }

        .guide-nav svg {
            display: block;
        }

        .guide-nav:active {
            transform: scale(0.85);
        }

        .qr {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        /* 11. Mobile (≤768px) -------------------------------------------------------- */

        @media screen and (max-width: 768px) {
            #squashLabel,
            #scaleLabel,
            #expandBtn,
            #blockCountContainer .label-text,
            #countInput,
            .search-label {
                display: none !important;
            }

            body {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 15vh;
            }

            .scene {
                left: 0 !important;
                top: 8dvh;
                bottom: auto;
                order: 1;
                margin: 0;
            }

            .controls {
                position: absolute;
                top: calc(100% - 250px);
                bottom: auto;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
                max-width: 90%;
                padding: 9px 15px;
                margin: 0;
                z-index: 100;
                box-sizing: border-box;
                font-size: 14px;
                min-height: 0;
                transition: min-height 0.4s ease-out, border-radius 0.4s ease-out;
            }

            .controls-item {
                margin-bottom: 10px;
            }

            .controls button,
            .controls label:not(.toggle-label),
            #countInput {
                font-size: 14px;
            }

            /* Search becomes a bottom sheet */
            .search-row {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 9px 12px;
                font-size: 14px;
            }

            .search-ico {
                display: inline-flex;
            }

            .search-panel {
                position: fixed;
                top: auto;
                left: 12px;
                right: 12px;
                bottom: 12px;
                border-radius: 12px;
                z-index: 1000;
            }

            .search-panel.is-open {
                height: calc(100dvh - 24px - env(safe-area-inset-top));
                padding-bottom: calc(16px + env(safe-area-inset-bottom));
            }

            .search-close .ico-x {
                display: none;
            }

            .search-close .ico-roll {
                display: block;
            }

            /* Promote header children to panel flex items so the close
               button can be reordered below the list */
            .search-panel-header {
                display: contents;
            }

            .search-panel-title {
                order: -1;
                flex: 0 0 auto;
                margin-bottom: 12px;
                font-size: 16px;
            }

            .search-panel .search-body {
                order: 0;
            }

            .search-panel .search-close {
                order: 1;
                flex: 0 0 auto;
                width: 100%;
                height: 44px;
                margin-top: 12px;
                font-size: 15px;
            }

            /* Action row ordering */
            #resetBtn { order: 1; }
            #shareBtn { order: 2; }
            #solveBtn { order: 3; }

            /* Stepper: fixed-size buttons, inspector row fills the middle */
            #blockCountContainer .number-control {
                gap: 6px;
            }

            #blockCountContainer .num-btn {
                width: 34px;
                flex: 0 0 34px;
                height: 30px;
            }

            .inspector-row {
                display: flex;
                align-items: center;
                gap: 1px;
                width: auto;
            }

            .inspect-btn {
                height: 30px;
                font-size: 11px;
                margin: 0;
                padding: 0 2px;
            }

            /* Solution list collapses to a single-line ticker */
            .dynamic-control.show-stretch {
                margin-top: 6px;
                max-height: 200px;
                overflow-y: auto;
            }

            .solution-list {
                padding: 0 !important;
                height: 32px;
                min-height: 32px;
                max-height: 32px !important;
                overflow-y: hidden !important;
                scroll-behavior: smooth;
                border-radius: 8px;
            }

            .solution-list div {
                height: 32px;
                line-height: 32px;
                border-bottom: none !important;
                text-align: center;
                padding: 0 5px !important;
            }

            /* Tutorial adjustments */
            body:not(.tutorial-active).is-solving footer {
                opacity: 0;
                pointer-events: none;
            }

            body.tutorial-active .controls {
                top: calc(100% - 315px) !important;
                bottom: auto !important;
            }

            body.tutorial-active.is-solving .controls {
                padding: 10px;
            }

            body.tutorial-active.is-solving .controls-item {
                margin-bottom: 6px;
            }

            body.tutorial-active.is-solving #solveBtn {
                height: 38px;
            }

            body.tutorial-active.is-solving #resetBtn,
            body.tutorial-active.is-solving #shareBtn {
                flex: 0 0 38px;
            }

            footer {
                gap: 6px;
            }

            .guide-nav {
                padding: 0 4px;
            }

            .tutorial-bubble {
                top: 1dvh;
                max-width: 92vw;
                width: max-content;
                padding: 10px;
                font-size: 14px;
                line-height: 1.3;
                left: 50%;
            }
        }
</style>
</head>
<body>
<div class="controls" id="controls">
    <label class="controls-item" id="scaleLabel">Scale:
        <input id="sizeInput" max="2" min="0.3" step="0.1" type="range" value="1">

            <input id="countInput" max="8" min="3" readonly type="number" value="6">

                     stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="18">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </span>
        </div>
        <div class="search-panel" id="searchPanel">
            <div class="search-panel-header">
                <span class="search-panel-title">Matching locks</span>
                <button aria-label="Close" class="search-close" id="searchClose" title="Close">

                         stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="18">
                        <line x1="18" x2="6" y1="6" y2="18"></line>
                        <line x1="6" x2="18" y1="6" y2="18"></line>

                    <svg class="ico-roll" fill="none" height="22" stroke="currentColor" stroke-linecap="round"
                         stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="22">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>
            <div class="search-body">
                <div class="search-empty" id="searchEmpty">No saved locks yet</div>
                <div class="search-list" id="searchList"></div>
            </div>
        </div>
    </div>
    <div class="action-row controls-item">
        <button aria-label="Reset" id="resetBtn" title="Reset Lock">
            <svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                 stroke-width="2.5" viewBox="0 0 24 24" width="20">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
            </svg>
        </button>
        <button id="solveBtn">Solve Lock</button>
        <button aria-label="Share" id="shareBtn" title="Share Lock State">
            <svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                 stroke-width="2.5" viewBox="0 0 24 24" width="20">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"></line>
                <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"></line>
            </svg>
        </button>
    </div>
    <label class="toggle-label dynamic-control" id="squashLabel">
        <input checked id="squashMovesCheck" type="checkbox">Squash
    </label>
    <div class="play-status-row dynamic-control">
        <div class="status-message" id="statusMsg"></div>
        <div class="playback-controls">
            <button id="restartSeqBtn" title="Restart Sequence">&#171;</button>
            <button id="playBtn" title="Play Full Solution">&#9654; Play</button>
        </div>
    </div>
    <div class="step-controls-row dynamic-control" id="stepControlsRow">
        <button id="prevBtn" title="Step Backward">&#9198;</button>
        <div style="display: flex; flex-direction: column; flex-grow: 1;">
            <div class="solution-list" id="solutionList"></div>
            <button class="expand-list-item" id="expandBtn">&#9660; Expand Full List &#9660;</button>
        </div>
        <button id="nextBtn" title="Step Forward">&#9197;</button>
    </div>
</div>
<div class="scene">
    <div class="lock-mechanism" id="lock"></div>
</div>
<div class="tutorial-overlay" id="tutorialOverlay"></div>
<div class="tutorial-arrow" id="tutorialArrow">&darr;</div>

</div>
